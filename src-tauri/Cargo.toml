[package]
  name = "tauri-app"
version = "0.1.0"
  description = "A fast comic reader application for Linux"
  authors = ["your-team"]
  license = ""

  # Tauri specific settings
edition = "2021"
rust-version = "1.85"

[lib]
name = "brave_comic_reader"

[dependencies]
  tauri = { version = "2.0.0-rc.1", features = ["image"] }
  tokio = { version = "1.35", features = ["full"] }
  rayon = "1.10"
  image = { version = "0.25", features = ["avif", "avif-native"] }
  serde = { version = "1.0", features = ["derive"] }
  serde_json = "1.0"
  thiserror = "1.0"
  blake3 = "1"
  rusqlite = { version = "0.32", features = ["bundled"] }
  uuid = { version = "1", features = ["v4"] }

  # Common virtual filesystem for archive formats
  lazy-archive = { git = "https://github.com/takanemu/archivefs", rev = "2bacabcd233bbeacae2dbf32efcff7f9a23d8050" }
  vfs-archive = { git = "https://github.com/takanemu/archivefs", rev = "2bacabcd233bbeacae2dbf32efcff7f9a23d8050" }
  tauri-plugin-dialog = "2"
  chrono = "0.4"
  webp = "0.3"
  turbojpeg = { version = "1", default-features = false, features = ["cmake", "require-simd"] }
  pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }

[dev-dependencies]
  zip = "2"
  tar = "0.4"
  tempfile = "3"
[build-dependencies]
  tauri = { version = "2.0.0-rc.1", features = [] }
  tauri-build = { version = "2", features = [] }

[features]
  default = []
